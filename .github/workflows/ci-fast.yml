name: CI Fast

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute changed files against origin/main (triple-dot = merge-base diff)
      - name: Fetch origin/main for diff
        run: |
          git fetch origin main --depth=1 2>/dev/null || git fetch origin main

      - name: Compute changed files
        id: changed_files
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Show changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed_files.outputs.changed }}"

      # Select tests to run
      - name: Select tests
        id: select_tests
        run: |
          SELECTION=$(echo "${{ steps.changed_files.outputs.changed }}" | python scripts/select_tests_for_ci.py)
          echo "selection<<EOF" >> $GITHUB_OUTPUT
          echo "$SELECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Show test selection
        run: |
          echo "Test selection:"
          echo "${{ steps.select_tests.outputs.selection }}"

      # Determine if Chromium install is needed
      - name: Check if Chromium needed
        id: chromium_check
        run: |
          CHANGED="${{ steps.changed_files.outputs.changed }}"
          NEEDS_CHROMIUM=false
          
          # Check each trigger pattern
          while IFS= read -r file; do
            case "$file" in
              harness/*)
                NEEDS_CHROMIUM=true
                ;;
              pipeline/execute.py)
                NEEDS_CHROMIUM=true
                ;;
              pipeline/reskin.py)
                NEEDS_CHROMIUM=true
                ;;
              pipeline/nodes/validate_execute.py)
                NEEDS_CHROMIUM=true
                ;;
            esac
          done <<< "$CHANGED"
          
          echo "needs_chromium=$NEEDS_CHROMIUM" >> $GITHUB_OUTPUT

      - name: Show Chromium decision
        run: |
          echo "Needs Chromium: ${{ steps.chromium_check.outputs.needs_chromium }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      # Conditional Chromium install
      - name: Install Chromium (if needed)
        if: ${{ steps.chromium_check.outputs.needs_chromium == 'true' }}
        run: playwright install --with-deps chromium

      # Run tests
      - name: Run pytest
        run: |
          SELECTION="${{ steps.select_tests.outputs.selection }}"
          if [ "$SELECTION" = "ALL" ]; then
            echo "Running FULL test suite (ALL)"
            pytest -v
          else
            echo "Running SELECTED tests:"
            echo "$SELECTION"
            pytest -v $SELECTION
          fi