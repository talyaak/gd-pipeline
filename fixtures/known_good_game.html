<!DOCTYPE html>
<html>
<head><title>Good Game</title></head>
<body>
<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
    }
    create() {
        const g = this.add.graphics();
        g.fillStyle(0x00ff00, 1);
        g.fillRect(0, 0, 16, 16);
        g.generateTexture('player', 16, 16);
        g.destroy();
        this.player = this.add.image(100, 100, 'player');
    }
    update(time, delta) {
        const dt = delta / 1000;
        this.player.x += 10 * dt;
    }
}

new Phaser.Game({
    type: Phaser.AUTO,
    width: 400,
    height: 300,
    scene: [MainScene],
});
</script>
</body>
</html>
