<!DOCTYPE html>
<html>
<head><title>Good Game</title></head>
<body>
<script>
class PlayScene extends Phaser.Scene {
    constructor() {
        super('PlayScene');
    }
    create() {
        const g = this.add.graphics();
        g.fillStyle(0x00ff00, 1);
        g.fillRect(0, 0, 16, 16);
        g.generateTexture('player', 16, 16);
        g.destroy();
        this.player = this.add.image(100, 100, 'player');
        
        // MRAID CTA button
        if (typeof mraid !== 'undefined') {
            // Per MRAID spec: listen for ready event, don't call ready()
            if (mraid.getState() === 'loading') {
                mraid.addEventListener('ready', () => {
                    // Bridge is ready, now gate on viewable
                    if (mraid.isViewable()) {
                        startGameplay();
                    } else {
                        mraid.addEventListener('viewableChange', (viewable) => {
                            if (viewable) startGameplay();
                        });
                    }
                });
            } else if (mraid.isViewable()) {
                startGameplay();
            } else {
                mraid.addEventListener('viewableChange', (viewable) => {
                    if (viewable) startGameplay();
                });
            }
        }
        this.ctaButton = this.add.rectangle(200, 150, 200, 50, 0x00aa00).setInteractive();
        this.ctaText = this.add.text(200, 150, 'INSTALL NOW', {fontSize: '24px', fill: '#ffffff'}).setOrigin(0.5);
        this.ctaButton.on('pointerdown', () => {
            if (typeof mraid !== 'undefined' && mraid.open) {
                mraid.open('https://example.com');
            } else {
                window.open('https://example.com', '_blank');
            }
        });

        // Gameplay start function
        function startGameplay() {
            // Game starts immediately (already running)
            // This is where you'd unpause game loop if gating on MRAID
            console.log('MRAID: Gameplay started (ready + viewable)');
        }
    }
    update(time, delta) {
        const dt = delta / 1000;
        this.player.x += 10 * dt;
        // Increment score to indicate active gameplay
        const game = this.scene.systems.game;
        if (game.registry.has('score')) {
            game.registry.inc('score', 1);
        }
    }
}

var game = new Phaser.Game({
    type: Phaser.AUTO,
    width: 400,
    height: 300,
    scene: [PlayScene],
});
window.__GAME__ = game;
game.registry.set('score', 0);
game.registry.set('gameOver', false);
</script>
</body>
</html>
