<!DOCTYPE html>
<html>
<head><title>Bad Game - CTA Missing</title></head>
<body>
<script>
class PlayScene extends Phaser.Scene {
    constructor() {
        super('PlayScene');
    }
    create() {
        const g = this.add.graphics();
        g.fillStyle(0x00ff00, 1);
        g.fillRect(0, 0, 16, 16);
        g.generateTexture('player', 16, 16);
        g.destroy();
        this.player = this.add.image(100, 100, 'player');
        
        // NO CTA BUTTON - completely missing
    }
    update(time, delta) {
        const dt = delta / 1000;
        this.player.x += 10 * dt;
        const game = this.scene.systems.game;
        if (game.registry.has('score')) {
            game.registry.inc('score', 1);
        }
        this.game.sessionTime = (this.game.sessionTime || 0) + delta;
    }
}

var game = new Phaser.Game({
    type: Phaser.AUTO,
    width: 400,
    height: 300,
    scene: [PlayScene],
});
window.__GAME__ = game;
game.registry.set('score', 0);
game.registry.set('gameOver', false);
</script>
</body>
</html>
