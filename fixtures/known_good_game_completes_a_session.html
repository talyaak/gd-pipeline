<!DOCTYPE html>
<html>
<body>
<script>
class PlayScene extends Phaser.Scene {
  constructor() { super('PlayScene'); }
  create() {
    this.game.registry.set('score', 0);
    this.game.registry.set('gameOver', false);
    this.game.registry.set('score', 1);
    // Simulate a real session that ends partway through the observation window
    // (not before it even starts — the harness spends ~7s on load/input setup
    // before it begins observing at all).
    this.time.delayedCall(10000, () => {
      this.game.registry.set('gameOver', true);
    });
  }
  update(time, delta) {
    const dt = delta / 1000;
    this.game.sessionTime = (this.game.sessionTime || 0) + delta;
  }
}
var game = new Phaser.Game({ type: Phaser.AUTO, width: 400, height: 300, scene: [PlayScene] });
window.__GAME__ = game;
</script>
</body>
</html>
