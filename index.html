<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>gd-gpt Playables</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a18;
    --card: #14142a;
    --border: #23234a;
    --accent: #33e6ff;
    --accent2: #ff33cc;
    --text: #f0f0ff;
    --dim: #8899bb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  header {
    padding: 32px 18px 18px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px; font-size: 26px; letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; font-size: 13px; color: var(--dim); }
  main {
    max-width: 480px; margin: 0 auto; padding: 10px 18px 40px;
    display: flex; flex-direction: column; gap: 14px;
  }
  a.card {
    display: block; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:active { transform: scale(0.98); border-color: var(--accent); }
  .thumb {
    height: 140px;
    background: linear-gradient(135deg, rgba(51,230,255,0.18), rgba(255,51,204,0.14));
    display: flex; align-items: center; justify-content: center;
  }
  .thumb svg { width: 56px; height: 56px; }
  .body { padding: 16px 18px 18px; }
  a.card .name-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 5px;
  }
  a.card .name { font-size: 18px; font-weight: 600; margin: 0; }
  a.card .desc { font-size: 13px; color: var(--dim); margin: 0; line-height: 1.45; }
  a.card .tag {
    display: inline-block; margin-top: 10px; font-size: 11px; padding: 4px 10px;
    border-radius: 20px; background: rgba(51,230,255,0.12); color: var(--accent);
    letter-spacing: 0.3px;
  }
  /* Play affordance: a pure CSS triangle in a pill, zero font/glyph
     dependency -- the emoji hero it replaced rendered as a hollow
     missing-glyph square in real Chromium (no color-emoji font), so
     nothing here may depend on a font glyph rendering correctly. */
  .play-pill {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--bg);
    background: var(--accent); padding: 5px 10px 5px 8px; border-radius: 20px;
  }
  .play-tri {
    width: 0; height: 0;
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 8px solid var(--bg);
  }
  #empty { text-align: center; color: var(--dim); font-size: 13px; padding: 40px 20px; }
  footer { text-align: center; padding: 14px 0 34px; font-size: 11px; color: #555a7a; }
</style>
</head>
<body>
<header>
  <h1>gd-gpt Playables</h1>
  <p>Tap a game to play it right in your browser</p>
</header>
<main id="cards"></main>
<footer>gd-gpt · playable prototypes</footer>
<script>
// Inline SVG icons -- never a font glyph/emoji, so a thumbnail can't ever
// render as a hollow missing-glyph square regardless of what fonts the
// viewer's browser has installed. Add a new icon key here if a future
// variant needs a different mark; 'crop' below covers farm/harvest themes.
const ICONS = {
  crop: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M12 21V10" stroke="#33e6ff" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="M12 13C12 13 6 12 6 6C12 6 12 13 12 13Z" fill="#ff33cc" opacity="0.85"/>' +
    '<path d="M12 10C12 10 18 9 18 4C12 4 12 10 12 10Z" fill="#33e6ff" opacity="0.85"/>' +
    '</svg>',
};

// Adding a new variant is exactly one entry here -- no layout changes needed.
const VARIANTS = [
  {
    file: 'harness/farm_idle.html',
    name: 'Farm Idle',
    tag: 'Arcade Idle / Farm',
    desc: 'Harvest, sell, upgrade -- grow an idle farm empire.',
    icon: 'crop',
  },
];

const main = document.getElementById('cards');

if (VARIANTS.length === 0) {
  const empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = 'No playables yet -- check back soon.';
  main.appendChild(empty);
} else {
  VARIANTS.forEach(v => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = v.file;
    a.innerHTML =
      '<div class="thumb">' + ICONS[v.icon] + '</div>' +
      '<div class="body">' +
        '<div class="name-row">' +
          '<p class="name">' + v.name + '</p>' +
          '<span class="play-pill"><span class="play-tri"></span>Play</span>' +
        '</div>' +
        '<p class="desc">' + v.desc + '</p>' +
        '<span class="tag">' + v.tag + '</span>' +
      '</div>';
    main.appendChild(a);
  });
}
</script>
</body>
</html>
