<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>gd-gpt Playables</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a18;
    --card: #14142a;
    --border: #23234a;
    --accent: #33e6ff;
    --accent2: #ff33cc;
    --text: #f0f0ff;
    --dim: #8899bb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  header {
    padding: 32px 18px 18px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px; font-size: 26px; letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; font-size: 13px; color: var(--dim); }
  main {
    max-width: 480px; margin: 0 auto; padding: 10px 18px 40px;
    display: flex; flex-direction: column; gap: 14px;
  }
  a.card {
    display: block; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:active { transform: scale(0.98); border-color: var(--accent); }
  .thumb {
    height: 140px;
    background: linear-gradient(135deg, rgba(51,230,255,0.18), rgba(255,51,204,0.14));
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  .body { padding: 16px 18px 18px; }
  a.card .name { font-size: 18px; font-weight: 600; margin: 0 0 5px; }
  a.card .desc { font-size: 13px; color: var(--dim); margin: 0; line-height: 1.45; }
  a.card .tag {
    display: inline-block; margin-top: 10px; font-size: 11px; padding: 4px 10px;
    border-radius: 20px; background: rgba(51,230,255,0.12); color: var(--accent);
    letter-spacing: 0.3px;
  }
  #empty { text-align: center; color: var(--dim); font-size: 13px; padding: 40px 20px; }
  footer { text-align: center; padding: 14px 0 34px; font-size: 11px; color: #555a7a; }
</style>
</head>
<body>
<header>
  <h1>gd-gpt Playables</h1>
  <p>Tap a game to play it right in your browser</p>
</header>
<main id="cards"></main>
<footer>gd-gpt · playable prototypes</footer>
<script>
// Adding a new variant is exactly one entry here -- no layout changes needed.
const VARIANTS = [
  {
    file: 'harness/farm_idle.html',
    name: 'Farm Idle',
    tag: 'Arcade Idle / Farm',
    desc: 'Harvest, sell, upgrade -- grow an idle farm empire.',
    emoji: '🌾',
  },
];

const main = document.getElementById('cards');

if (VARIANTS.length === 0) {
  const empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = 'No playables yet -- check back soon.';
  main.appendChild(empty);
} else {
  VARIANTS.forEach(v => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = v.file;
    a.innerHTML =
      '<div class="thumb">' + v.emoji + '</div>' +
      '<div class="body">' +
        '<p class="name">' + v.name + '</p>' +
        '<p class="desc">' + v.desc + '</p>' +
        '<span class="tag">' + v.tag + '</span>' +
      '</div>';
    main.appendChild(a);
  });
}
</script>
</body>
</html>
